<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Storm Arena</title>
<style>
*{box-sizing:border-box;margin:0;touch-action:none;user-select:none;-webkit-user-select:none}
body{background:#10131c;color:#fff;font:600 16px system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%}
.pn{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;justify-content:safe center;gap:10px;background:#10131cdd;text-align:center;padding:16px;overflow-y:auto}
.pn.h{display:none}
h1{font-size:46px;color:#ffd23f;text-shadow:0 4px 0 #b8860b}
button,input,select{font:inherit;padding:12px 22px;border-radius:12px;border:0}
button{background:#ffd23f;color:#222;box-shadow:0 4px 0 #b8860b;cursor:pointer}
button:active{transform:translateY(3px);box-shadow:none}
button.s{background:#3b4560;color:#fff;box-shadow:0 4px 0 #222a3d}
input,select{background:#222a3d;color:#fff;text-align:center;user-select:text;-webkit-user-select:text}
input{width:220px}select{padding:8px;border-radius:8px}
#hud{position:fixed;top:8px;left:0;right:0;text-align:center;pointer-events:none;text-shadow:0 2px 3px #000;font-size:18px}
#ls div{background:#222a3d;border-radius:8px;padding:6px 18px;margin:3px}
#code{font-size:40px;letter-spacing:6px;color:#ffd23f}
small{opacity:.7;max-width:420px}
#set{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:460px}
#set label{font-size:13px;display:flex;flex-direction:column;gap:2px}
#cs,#cs2{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.cc{width:74px;padding:8px 2px;border-radius:14px;background:#222a3d;border:3px solid transparent;cursor:pointer;font-size:13px}
.cc b{display:block;font-size:30px}.cc.s{border-color:#ffd23f;background:#2f3a55}
#cd,#cd2{background:#222a3d;border-radius:14px;padding:10px 14px;max-width:440px;text-align:left;font-size:14px;line-height:1.5}
#cd h3,#cd2 h3{color:#ffd23f}#cd span,#cd2 span{display:inline-block;min-width:92px;font-size:11px;font-weight:800;padding:1px 6px;border-radius:6px;margin-right:6px;color:#222;text-align:center}

#sp span{min-width:130px;text-align:center;text-shadow:0 2px 3px #000;pointer-events:none}
#mt{position:fixed;right:10px;top:10px;padding:8px 12px;z-index:6}
</style></head><body>
<canvas id="c"></canvas><div id="hud"></div>
<div class="ab" id="ab"><button id="b1">Q</button><button id="b2" class="s">E</button></div>
<button id="lv" class="s" style="position:fixed;left:10px;top:10px;display:none">Leave game</button>
<button id="mt" class="s">🔊</button>
<div id="sp"><button class="s" id="spL">◀</button><span id="spN"></span><button class="s" id="spR">▶</button></div>

<div class="pn" id="menu">
<h1>STORM ARENA</h1>
<input id="nm" maxlength="12" placeholder="Your name">
<div id="cs"></div><div id="cd"></div>
<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button id="bh">Host a room</button><button id="bo" class="s">Play offline (bots)</button></div>
<div><input id="rc" maxlength="4" placeholder="Room code" style="width:130px;text-transform:uppercase"> <button id="bj" class="s">Join</button></div>
<small id="mg">Pick a wizard! Move: WASD / left stick. Aim + shoot: mouse / right stick. Q = ability, E = ultimate. Bushes hide people, houses are dark from outside. 💧 Springs heal, 🔮 wells charge your ultimate.</small>
</div>

<div class="pn h" id="lobby">
<small>Room code</small><div id="code">----</div>
<small id="lk"></small><div id="ls"></div>
<small>Pick your wizard (you can change it until the game starts)</small><div id="cs2"></div><div id="cd2"></div>
<div id="set">
 <label>Players<select id="s1"><option>6<option>8<option selected>10<option>12</select></label>
 <label>Mode<select id="s2"><option value="0">Showdown (battle royale)<option value="1">Brawl Rush (first to 10 kills)<option value="2">Hot Zone (hold the zone)</select></label>
 <label>Bots<select id="s5"><option value="1">On (fill the room)<option value="0">Off (real players only)</select></label>
</div>
<button id="bs">Start game</button>
<button id="bl1" class="s">Leave</button>
</div>

<div class="pn h" id="end">
<h1 id="et"></h1><div id="es"></div>
<button id="ba">Play again</button>
<button id="bl2" class="s">Leave</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(()=>{
/* =====================================================================
   STORM ARENA: single-script build
   Sections: 1 Constants  2 Wizards  3 UI  4 Networking  5 World
             6 Navigation  7 Simulation  8 Bot AI  9 Sound  10 Effects
             11 Rendering  12 Input  13 Main loop
   The host runs the simulation; clients send input and render snapshots.
   ===================================================================== */

// ---------- 1. Constants & state ----------
const $=id=>document.getElementById(id),cv=$('c'),g=cv.getContext('2d');
const A=2000,W=A*2,C=A;          // arena radius, world size, centre
const STP=520,HC=170;            // town block spacing / half size
const V=520;                     // vision radius
const GS=32,GN=125;              // navigation grid cell size / cells per side
const OL='#2a1a3a';              // cartoon outline colour
const COLS=['#ff4d4d','#4dc3ff','#6bff6b','#ffd23f','#c77dff','#ff9f43','#2ee6c5','#ff7ac6'];
const NAMES=[['Goofball','Noodle','Potato','Derp','Bonkers','Muffin','Doofus','Clumsy'],['Sam','Max','Rex','Dave','Pete','Lou','Gus','Bob'],['Socrates','Einstein','Newton','Tesla','Plato','Curie','Darwin','Hawking']];
const ZK=['fire','frost','heal','met'];            // zone kinds (index sent over the network)
let cls=0,S={n:10,m:0},peer,host=false,hc=null,me=-1,st='menu',lobby=[],code='',spec=-1;
let P=[],B=[],R=[],Bu=[],Bd=[],Wl=[],Gp=[],Sz=[],Zn=[],EV=[],hz=null,md=0,zr=C,zt=0,netT=0,inT=0;
let keys={},mouse={x:0,y:0,d:0},pq=0,pu=0,DT=.016,last=0;
const tch={m:null,a:null,mx:0,my:0,ax:0,ay:0,on:0};

// ---------- 2. Wizards ----------
// Each has a main attack (ef = on-hit effect), an ability (Q), an ultimate (E, charged by fighting) and a passive.
const CL=[
{n:'Ember',t:'Pyromancer',i:'🔥',oc:'#e8552b',hr:'#8a2b1a',sk:'#f5cba7',hs:0,sc:'#ff8a3d',gl:22,hp:145,sp:225,d:17,cd:.55,bs:650,bt:.85,r:330,fl:.3,ef:'burn',
 mn:['Fireball','sets enemies ablaze: 5 dmg/s for 3s'],ab:{n:'Flame Pool',x:'throw a pool of fire that burns anyone inside',k:'pool',cd:7},
 ul:{n:'Meteor',x:'a meteor crashes on the enemy you aim at (they can dodge!)',k:'meteor'},ps:{n:'Ashes',x:'every kill heals you for 30 HP',k:'ash'}},
{n:'Frost',t:'Cryomancer',i:'❄️',oc:'#4a8fd6',hr:'#e8f6ff',sk:'#f0d9c8',hs:1,sc:'#7fdcff',gl:22,hp:170,sp:210,d:14,cd:.6,bs:700,bt:.75,r:300,fl:.25,ef:'slow',
 mn:['Ice Shard','slows enemies it hits'],ab:{n:'Frost Nova',x:'freeze nearby enemies for 1.2s + damage',k:'nova',cd:8},
 ul:{n:'Blizzard',x:'a freezing storm follows you for 6s',k:'blizzard'},ps:{n:'Permafrost',x:'enemies that hurt you up close get slowed',k:'frost'}},
{n:'Lumi',t:'Light Cleric',i:'✨',oc:'#f4d35e',hr:'#c99a2e',sk:'#f5d0b5',hs:2,sc:'#ffe27a',gl:24,hp:125,sp:230,d:12,cd:.5,bs:900,bt:.7,r:340,fl:.3,ef:'pierce',
 mn:['Light Beam','pierces every enemy in line'],ab:{n:'Sanctuary',x:'a holy circle that rapidly heals you',k:'sanct',cd:9},
 ul:{n:'Solar Flare',x:'blast + blind nearby enemies, heal 40',k:'flare'},ps:{n:'Blessed',x:'natural healing is 60% faster',k:'bless'}},
{n:'Hex',t:'Warlock',i:'🌙',oc:'#6b3fa0',hr:'#2d1a4a',sk:'#d8b9a0',hs:3,sc:'#b78cff',gl:22,hp:115,sp:225,d:13,cd:.4,bs:800,bt:.7,r:280,fl:.3,ef:'drain',
 mn:['Soul Bolt','steals 45% of damage dealt as health'],ab:{n:'Shadow Step',x:'teleport forward in your move direction',k:'step',cd:6},
 ul:{n:'Soul Rift',x:'drag nearby enemies next to you, damaged and slowed',k:'rift'},ps:{n:'Shadow Cloak',x:'stand still 1.5s to turn invisible',k:'cloak'}},
{n:'Volt',t:'Stormcaller',i:'⚡',oc:'#d9b800',hr:'#3a3a55',sk:'#c98f60',hs:4,sc:'#ffe84a',gl:20,hp:105,sp:260,d:11,cd:.32,bs:850,bt:.6,r:300,fl:.3,ef:'chain',
 mn:['Arc Bolt','lightning jumps to a 2nd enemy (60% dmg)'],ab:{n:'Thunder Dash',x:'dash forward and zap everyone you pass',k:'zap',cd:6},
 ul:{n:'Storm Call',x:'for 3s lightning strikes the nearest enemy',k:'storm'},ps:{n:'Static',x:'every 3rd shot deals +60% damage',k:'stat'}}];

// ---------- 3. UI ----------
const show=id=>{['menu','lobby','end'].forEach(x=>$(x).classList.toggle('h',x!=id));$('ab').style.display=id?'none':'flex';$('lv').style.display='none';$('sp').style.display='none'};
const MENU_MSG=$('mg').textContent,msg=t=>toMenu(t);
const row=(l,c,n,x)=>'<div><span style="background:'+c+'">'+l+'</span><b>'+n+'</b> — '+x+'</div>';
function pick(i){cls=i;for(const el of[$('cs'),$('cs2')])[...el.children].forEach((x,j)=>x.classList.toggle('s',j==i));const c=CL[i];
  $('cd').innerHTML=$('cd2').innerHTML='<h3>'+c.i+' '+c.n+', '+c.t+'</h3><div style="opacity:.8;margin-bottom:4px">❤ '+c.hp+' HP · 👟 '+(c.sp>245?'Fast':'Normal')+'</div>'+
    row('MAIN','#ffd23f',c.mn[0],c.mn[1])+row('ABILITY (Q)','#6ee7ff',c.ab.n,c.ab.x)+row('ULTIMATE (E)','#ff7ac6',c.ul.n,c.ul.x)+row('PASSIVE','#9dff8a',c.ps.n,c.ps.x);
  if(st=='lobby'){if(host){lobby[0].k=i;sendLobby()}else if(hc&&hc.open)hc.send({t:'k',k:i})}} // change wizard while waiting in a lobby
for(const el of[$('cs'),$('cs2')])CL.forEach((c,i)=>{const d=document.createElement('div');d.className='cc';d.innerHTML='<b>'+c.i+'</b>'+c.n;d.onclick=()=>pick(i);el.appendChild(d)});pick(0);
$('rc').value=(new URLSearchParams(location.search).get('room')||'').toUpperCase();
const myName=()=>($('nm').value.trim()||'Player'+(Math.random()*90+10|0)).slice(0,12);
function drawLobby(){const l=$('ls');l.textContent='';lobby.forEach(x=>{const d=document.createElement('div');d.textContent=CL[x.k|0].i+' '+x.n+' ('+CL[x.k|0].n+')';l.appendChild(d)});
  $('code').textContent=code;$('bs').style.display=$('set').style.display=host?'':'none'}
const bc=m=>lobby.forEach(l=>l.conn&&l.conn.open&&l.conn.send(m));        // host -> lobby members
const bc2=m=>P.forEach(p=>p.conn&&p.conn.open&&p.conn.send(m));           // host -> players in game
const sendLobby=()=>{drawLobby();bc({t:'l',l:lobby.map(x=>x.n),k:lobby.map(x=>x.k|0)})};
const leave=()=>toMenu();
function toMenu(text){ // back to the main menu without reloading the page (a reload 404s inside previews)
  const p=peer;st='menu';peer=hc=null;host=false;
  if(p)try{p.destroy()}catch(e){}
  lobby=[];P=[];B=[];Zn=[];EV=[];Q=[];KF=[];me=-1;hz=null;md=0;zr=C;zt=0;spec=-1;code='';flash=KO=shk=vg=0;
  keys={};mouse.d=0;tch.m=tch.a=null;tch.mx=tch.my=tch.ax=tch.ay=0;
  $('s5').parentElement.style.display='';$('lk').textContent='';$('mg').textContent=text||MENU_MSG;show('menu');
}
$('bl1').onclick=$('bl2').onclick=$('lv').onclick=leave;

// ---------- 4. Networking (PeerJS, host-authoritative) ----------
$('bh').onclick=()=>{host=true;mkRoom()};
// Offline practice: no network. This tab hosts a lobby of one and bots fill the rest.
$('bo').onclick=()=>{
  host=true;code='OFFLINE';lobby=[{n:myName(),c:0,k:cls}];st='lobby';
  $('s5').value='1';$('s5').parentElement.style.display='none'; // bots are always on offline
  $('lk').textContent='Practice mode: no network needed.';
  show('lobby');drawLobby();
};
function mkRoom(){
  code=Math.random().toString(36).slice(2,6).toUpperCase();
  peer=new Peer('storm-'+code);
  peer.on('error',e=>{if(e.type=='unavailable-id')mkRoom();else msg('Network error: '+e.type)});
  peer.on('open',()=>{
    lobby=[{n:myName(),c:0,k:cls}];st='lobby';show('lobby');
    $('lk').textContent=location.origin+location.pathname+'?room='+code;drawLobby();
    peer.on('connection',c=>{
      c.on('data',m=>{
        if(m.t=='j'&&st=='lobby'&&lobby.length<+$('s1').value){lobby.push({n:String(m.n).slice(0,12),c:m.c&7,k:m.k>=0&&m.k<CL.length?m.k|0:0,conn:c});sendLobby()}
        else if(m.t=='k'){const l=lobby.find(x=>x.conn==c);if(l&&st=='lobby'&&m.k>=0&&m.k<CL.length){l.k=m.k|0;sendLobby()}}
        else if(m.t=='i'&&c.pi!=null&&P[c.pi]){const p=P[c.pi];p.mx=+m.mx||0;p.my=+m.my||0;p.a=+m.a||0;p.f=m.f?1:0;if(m.q)p.aq=1;if(m.u)p.au=1}
      });
      c.on('close',()=>{lobby=lobby.filter(l=>l.conn!=c);if(st=='lobby')sendLobby();else if(c.pi!=null&&P[c.pi])P[c.pi].hp=0});
    });
  });
}
$('bj').onclick=()=>{
  const rc=$('rc').value.trim().toUpperCase();if(!rc)return;
  host=false;code=rc;peer=new Peer();
  peer.on('error',e=>msg(e.type=='peer-unavailable'?'Room not found':'Network error: '+e.type));
  peer.on('open',()=>{
    hc=peer.connect('storm-'+rc,{reliable:true});
    hc.on('open',()=>{hc.send({t:'j',n:myName(),c:0,k:cls});st='lobby';lobby=[];show('lobby');$('lk').textContent='';drawLobby()});
    hc.on('data',onData);
    hc.on('close',()=>{if(st!='menu')msg('Host left the game')});
  });
};
for(const id of['rc','nm'])$(id).addEventListener('keydown',e=>{if(e.key=='Enter'&&st=='menu'&&$('rc').value.trim().length==4)$('bj').click()});
function onData(m){ // client side
  if(m.t=='l'){lobby=m.l.map((n,i)=>({n,k:m.k?m.k[i]:0}));if(st!='lobby'){st='lobby';show('lobby')}drawLobby()}
  else if(m.t=='s'){
    world(m.seed);P=m.ps.map(p=>({...mkPlayer(p,0),first:1}));me=m.you;md=m.md;spec=-1;hz=null;B=[];Zn=[];zr=C;st='play';show(null)}
  else if(m.t=='u'&&(st=='play'||st=='over')){
    m.p.forEach((a,i)=>{const p=P[i];p.tx=a[0];p.ty=a[1];if(p.first){p.x=p.tx;p.y=p.ty;p.first=0}
      p.a=a[2];p.hp=a[3];p.k=a[4];p.fl=a[5];p.ac=a[6];p.ch=a[7];p.pt=a[8];p.sc=a[9]});
    B=m.b.map(a=>({x:a[0],y:a[1],c:a[2]}));zr=m.z;hz=m.h?{x:m.h[0],y:m.h[1]}:null;
    Zn=m.zn.map(a=>({x:a[0],y:a[1],r:a[2],f:a[3],k:ZK[a[4]]}));m.ev.forEach(e=>evFx(...e));(m.sz||[]).forEach((a,i)=>{if(Sz[i]){Sz[i].gx=a[0];Sz[i].gy=a[1]}});
  }else if(m.t=='e')finish(m.w);
}

// ---------- 5. World ----------
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const inBush=q=>Bu.some(b=>Math.hypot(b.x-q.x,b.y-q.y)<b.r);
const hid=q=>!(q.fl&16)&&((q.fl&2)||inBush(q));                    // hidden in bush / cloak unless it just shot
const bi=q=>Bd.findIndex(b=>q.x>b.x&&q.x<b.x+b.w&&q.y>b.y&&q.y<b.y+b.h); // building index (-1 = outside)
function bld(x,y,w,h,ew){ // house: walls with a door gap in two opposite walls
  const t=22,dg=96;Bd.push({x,y,w,h});
  const hw=(yy,gap)=>{if(!gap)Wl.push({x,y:yy,w,h:t});else{const m=(w-dg)/2;Wl.push({x,y:yy,w:m,h:t},{x:x+m+dg,y:yy,w:m,h:t})}};
  const vw=(xx,gap)=>{const L=h-2*t;if(!gap)Wl.push({x:xx,y:y+t,w:t,h:L});else{const m=(L-dg)/2;Wl.push({x:xx,y:y+t,w:t,h:m},{x:xx,y:y+t+m+dg,w:t,h:m})}};
  hw(y,!ew);hw(y+h-t,!ew);vw(x,ew);vw(x+w-t,ew);
}
function world(seed){
  const r=rng(seed);R=[];Bu=[];Gp=[];Bd=[];Wl=[];Sz=[];
  const bush=(x,y,n,s)=>{for(let j=0;j<n;j++)Bu.push({x:x+(r()-.5)*(s||130),y:y+(r()-.5)*(s||130),r:48+r()*25})};
  for(let i=-3;i<=3;i++)for(let j=-3;j<=3;j++){ // walled town: one themed block per grid cell
    const cx=C+i*STP,cy=C+j*STP;if(Math.hypot(Math.abs(i)*STP+HC,Math.abs(j)*STP+HC)>1780)continue;
    const k=r(),sx=r()<.5?-1:1,sy=r()<.5?-1:1,sw=r()<.5;
    if(r()<.6)bush(cx+STP/2,cy+STP/2,2,50);
    if(!i&&!j){for(let n=0;n<4;n++){const a=n*1.571+.785;R.push({x:C+Math.cos(a)*95,y:C+Math.sin(a)*95,r:22})}continue} // plaza pillars
    if(k<.32)bld(cx-(250+(r()*90|0))/2,cy-(210+(r()*110|0))/2,250+(r()*90|0),210+(r()*110|0),r()<.5); // house
    else if(k<.52){const H=(ox,oy,w,h)=>{if(sw){[ox,oy]=[oy,ox];[w,h]=[h,w]}Wl.push({x:cx+ox-w/2,y:cy+oy-h/2,w,h,hd:1})};H(-70,-75,200,34);H(70,75,200,34);bush(cx,cy,2)} // hedges
    else if(k<.66){const hx=sx>0?cx-120:cx-80,vx=sx>0?cx-120:cx+90,hy=sy>0?cy-100:cy+70,vy=sy>0?cy-100:cy-80;Wl.push({x:hx,y:hy,w:200,h:30,st:1},{x:vx,y:vy,w:30,h:180,st:1});R.push({x:cx-sx*20,y:cy-sy*10,r:26});bush(cx+sx*90,cy+sy*90,2)} // ruins
    else if(k<.8){const gt=r()*6|0;for(let q=0;q<6;q++)if(q!=gt){const a=q/6*6.283+.3;R.push({x:cx+Math.cos(a)*105,y:cy+Math.sin(a)*105,r:22+r()*8})}bush(cx,cy,1)} // stone fort
    else if(k<.9)R.push({x:cx,y:cy,r:105+r()*45,w:1}); // pond
    else{bush(cx-70,cy-70,2);bush(cx+70,cy+70,2);R.push({x:cx+60,y:cy-60,r:30})} // grove
  }
  biomes(r);
  const free=d=>{let x,y,t=0;do{const a=r()*6.283,q=Math.sqrt(r())*d;x=C+Math.cos(a)*q;y=C+Math.sin(a)*q}while((Wl.some(b=>x>b.x-40&&x<b.x+b.w+40&&y>b.y-40&&y<b.y+b.h+40)||R.some(o=>Math.hypot(o.x-x,o.y-y)<o.r+60))&&++t<40);return[x,y]};
  for(let i=0;i<7;i++){const[x,y]=free(A-400);Sz.push({x,y,r:70,k:i<4?'spring':'mana'})} // healing springs / ultimate wells
  scatter(r);grid();buildMini();
}

// ---------- Biomes: big warped Voronoi regions, so borders are wavy but clear ----------
// 0 desert  1 snow  2 swamp  3 meadow  4 plains (the town centre stays normal grass)
const BRGB=[[217,194,122],[230,240,245],[47,74,60],[116,176,78],[60,90,60]];
let BS=[],BW={},BC=null,MC=null,Dc=[];     // region seeds, warp params, biome canvas, minimap layer, decoration
const biomeAt=(x,y)=>{
  const wx=x+BW.a*Math.sin(y*.004+BW.p)+BW.b*Math.sin(y*.011+BW.q),wy=y+BW.a*Math.sin(x*.004+BW.q)+BW.b*Math.sin(x*.011+BW.p);
  let t=4,bd=1e12;for(const s of BS){const d=(wx-s.x)*(wx-s.x)+(wy-s.y)*(wy-s.y);if(d<bd){bd=d;t=s.t}}return t};
function biomes(r){
  BW={a:110+r()*40,b:50+r()*30,p:r()*6.283,q:r()*6.283};
  const ty=[0,1,2,3];for(let i=3;i>0;i--){const j=r()*(i+1)|0;[ty[i],ty[j]]=[ty[j],ty[i]]} // each biome appears, neighbours differ
  const pk=ex=>{const o=[0,1,2,3].filter(v=>!ex.includes(v));return o[r()*o.length|0]};

// Think a few times per second (slower for dumb bots), act every frame. iq (0..1) scales reaction, aim lead and caution.
function ai(p,i,dt){
  const c=CL[p.cl],dist=q=>Math.hypot(q.x-p.x,q.y-p.y),dc=Math.hypot(p.x-C,p.y-C),
    vis=q=>q&&q.hp>0&&!(hid(q)&&dist(q)>200)&&los(p.x,p.y,q.x,q.y);
  p.rt-=dt;p.pr-=dt;
  if(p.rt<=0){
    p.rt=.15+(1-p.iq)*.5;p.aj=(Math.random()-.5)*(1-p.iq)*.6;if(Math.random()<.3)p.sd=-p.sd;
    const cur=P[p.tg],cdi=vis(cur)?dist(cur):1e9;let best=null,bd=1e9;
    for(const q of P)if(q!==p&&vis(q)){const d=dist(q);if(d<bd){bd=d;best=q}}
    if(best&&(cdi>900||bd<cdi*.7))p.tg=P.indexOf(best); // sticky target
    const t=P[p.tg],td=vis(t)?dist(t):1e9,see=450+p.iq*450,hf=p.hp/c.hp;
    if(td<see)p.lk={x:t.x,y:t.y};
    let pk=null,pd=300+p.iq*500;for(const k of Bu){const d=dist(k);if(d<pd){pd=d;pk=k}}
    let s='search';
    if(!S.m&&dc>zr-40-p.iq*220)s='storm';
    else if(td<see&&hf<c.fl*(.5+p.iq))s='flee';
    else if(pk&&hf<.6&&td>350&&p.iq>.25)s='hide';
    else if(td<see)s='chase';
    if(s=='storm'&&p.s!='storm')p.dest=freePt(C,C,90);
    if(s=='hide')p.dest={x:pk.x,y:pk.y};
    if(s=='search'&&(p.s!='search'||dist(p.dest)<60)){
      if(p.lk&&p.iq>.4){p.dest=p.lk;p.lk=null}else p.dest=freePt(C,C,zr*.7)}
    if(S.m==2&&s=='search')p.dest=freePt(hz.x,hz.y,110);
    p.s=s;
  }
  const t=P[p.tg],ok=vis(t),td=ok?dist(t):1e9,rg=c.bs*c.bt,b=ok?Math.atan2(t.y-p.y,t.x-p.x):0;

  }else if(p.s=='flee'&&ok){
    [mx,my]=nav(p,p.x+(-Math.cos(b)+Math.cos(b+1.57)*p.sd*.5)*260,p.y+(-Math.sin(b)+Math.sin(b+1.57)*p.sd*.5)*260);
    if(p.iq>.4)aim();else a=Math.atan2(my,mx);
  }else{
    const dd=p.s=='chase'&&p.lk?p.lk:p.dest,d=Math.hypot(dd.x-p.x,dd.y-p.y);
    if(d>5){[mx,my]=nav(p,dd.x,dd.y);a=Math.atan2(my,mx)}
    if(p.s=='hide'&&ok&&p.iq>.5)aim();
  }
  const w={nova:ok&&td<150,pool:ok&&td>140&&td<450,sanct:p.hp<c.hp*.55&&p.rl>0,step:p.s=='flee',zap:p.s=='flee'||(p.s=='chase'&&ok&&td>c.r*1.3)}[c.ab.k];

  if(p.ch>=100&&ok&&td<rg*.8&&Math.random()<dt*(.2+p.iq*2))p.au=1;

}

  for(const z of Sz){const sp=z.k=='spring';g.globalAlpha=pa;g.fillStyle=sp?'#3fc7e8':'#8a5cff';g.strokeStyle=sp?'#bff4ff':'#e0ccff';g.lineWidth=4;g.beginPath();g.arc(z.x,z.y,z.r,0,7);g.fill();g.stroke();g.globalAlpha=1;
    g.font='26px sans-serif';g.fillStyle='#fff';g.fillText(sp?'💧':'🔮',z.x,z.y+9)}
  for(const z of Zn){const fr=z.T?z.t/z.T:z.f;
    if(z.k=='met'){const p=1-fr;g.strokeStyle='#ff3b3b';g.lineWidth=5;g.beginPath();g.arc(z.x,z.y,z.r,0,7);g.stroke();g.fillStyle='rgba(255,70,40,'+(.12+.28*p)+')';g.beginPath();g.arc(z.x,z.y,z.r*p,0,7);g.fill();g.font='bold 44px sans-serif';g.fillStyle='#fff';g.fillText('☄️',z.x,z.y-90*fr+14)}
    else{const c={fire:'255,140,40',frost:'140,220,255',heal:'90,255,140'}[z.k];g.fillStyle='rgba('+c+','+(za+.06*Math.sin(T*4))+')';g.strokeStyle='rgba('+c+',.85)';g.lineWidth=3;g.beginPath();g.arc(z.x,z.y,z.r*Math.min(1,fr/.15),0,7);g.fill();g.stroke()}}
}
function bushes(){for(const[col,dr,ox,oy,k]of[[OL,4,0,0,1],['#3da048',0,0,0,1],['#56c25f',0,-.25,-.3,.5]])for(const q of Bu){g.fillStyle=col;g.beginPath();g.arc(q.x+ox*q.r,q.y+oy*q.r,q.r*k+dr,0,7);g.fill()}}
function walls(){ // outlines first, then fills, so pieces of one wall never show seams
  g.lineJoin='round';g.strokeStyle=OL;g.lineWidth=10;
  for(const w of Wl)g.strokeRect(w.x,w.y,w.w,w.h);
  for(const w of Wl){g.fillStyle=w.hd?'#2f7d3a':w.st?'#6b7280':'#5a4632';g.fillRect(w.x,w.y,w.w,w.h);
    if(w.hd||w.st){g.fillStyle=w.hd?'#44b04f':'#8b93a3';g.fillRect(w.x+5,w.y+5,w.w-10,w.h-10)}}
  for(const r of R)if(!r.w){g.lineWidth=4;g.fillStyle='#6b7280';g.beginPath();g.arc(r.x,r.y,r.r,0,7);g.fill();g.stroke();g.fillStyle='rgba(255,255,255,.2)';g.beginPath();g.arc(r.x-r.r*.3,r.y-r.r*.3,r.r*.35,0,7);g.fill()}
}
function roofs(m){ // every house you are not inside is dark from above
  const mb=bi(m);g.fillStyle='#3a2c3a';Bd.forEach((q,k)=>{if(k!=mb)g.fillRect(q.x+22,q.y+22,q.w-44,q.h-44)});
  g.save();g.beginPath();Bd.forEach((q,k)=>{if(k!=mb)g.rect(q.x+22,q.y+22,q.w-44,q.h-44)});g.clip();g.textAlign='center';padsAndZones(.8,.45);g.restore();
}
const lc=document.createElement('canvas');let RL=null,lm=null;
function light(m,w,h){ // low-res soft darkness; wall ray lengths are eased over time so it never flickers
  const cw=Math.max(1,w>>2),ch=Math.max(1,h>>2),N=120;if(lc.width!=cw||lc.height!=ch){lc.width=cw;lc.height=ch}
  const L=lc.getContext('2d'),s=Math.min(w,h)/650,k=1-Math.exp(-DT*16);
  if(!RL||lm!==m)RL=new Float32Array(N).fill(-1);lm=m;
  L.globalCompositeOperation='source-over';L.setTransform(1,0,0,1,0,0);L.clearRect(0,0,cw,ch);L.fillStyle='rgba(8,10,32,.4)';L.fillRect(0,0,cw,ch);
  L.setTransform(s/4,0,0,s/4,cw/2,ch/2);L.translate(-m.x,-m.y);L.globalCompositeOperation='destination-out';L.beginPath();
  for(let i=0;i<N;i++){const a=i/N*6.2832,dx=Math.cos(a),dy=Math.sin(a),t=rayR(m.x,m.y,dx,dy,V);RL[i]=RL[i]<0?t:RL[i]+(t-RL[i])*k;
    const x=m.x+dx*(RL[i]+20),y=m.y+dy*(RL[i]+20);i?L.lineTo(x,y):L.moveTo(x,y)}
  L.closePath();const q=L.createRadialGradient(m.x,m.y,V*.4,m.x,m.y,V*1.05);q.addColorStop(0,'rgba(0,0,0,1)');q.addColorStop(1,'rgba(0,0,0,0)');L.fillStyle=q;L.fill();
  g.imageSmoothingEnabled=true;g.drawImage(lc,0,0,w,h)
}
function aimLane(){ // shows the lane your bolt will travel (width = hit size, length = range, stops at walls)
  const q=P[me];if(!q||q.hp<=0)return;
  const c=CL[q.cl],a=input().a,dx=Math.cos(a),dy=Math.sin(a),R0=c.bs*c.bt,L=Math.min(R0,rayR(q.x,q.y,dx,dy,R0)),f=mouse.d||(tch.a&&Math.hypot(tch.ax,tch.ay)>.15);
  g.save();g.translate(q.x,q.y);g.rotate(a);const gr=g.createLinearGradient(0,0,L,0);gr.addColorStop(0,c.sc+(f?'99':'55'));gr.addColorStop(1,c.sc+'00');
  g.fillStyle=gr;g.fillRect(26,-22,Math.max(0,L-26),44);g.strokeStyle=c.sc+'aa';g.lineWidth=2;g.setLineDash([10,8]);
  g.beginPath();g.moveTo(26,-22);g.lineTo(L,-22);g.moveTo(26,22);g.lineTo(L,22);g.stroke();g.restore();
}
function drawFx(){ // bolts and particles
  aimLane();
  for(const b of B){const k=CL[b.c|0].sc;g.globalAlpha=.3;cir(b.x,b.y,11,k);g.globalAlpha=1;cir(b.x,b.y,6,k);cir(b.x,b.y,2.5,'#fff')}
  for(const f of Q){const k=f.t/f.l;g.globalAlpha=Math.min(1,k*1.5);
    if(f.k=='c'){g.fillStyle=f.c;g.beginPath();g.arc(f.x,f.y,f.r*k+1,0,7);g.fill()}
    else if(f.k=='t'){g.font='bold '+f.z+'px sans-serif';g.textAlign='center';g.lineWidth=4;g.strokeStyle=OL;g.strokeText(f.s,f.x,f.y);g.fillStyle=f.c;g.fillText(f.s,f.x,f.y)}
    else if(f.k=='r'){g.strokeStyle=f.c;g.lineWidth=2+6*k;g.beginPath();g.arc(f.x,f.y,f.R*(1-k)+8,0,7);g.stroke()}
    else if(f.k=='l'){zap(f.x,f.y,f.x2,f.y2,f.c,6);zap(f.x,f.y,f.x2,f.y2,'#fff',2.5)}
    else if(f.k=='f')cir(f.x,f.y,70*(1-k)+30,'#fff');
    else if(f.k=='s'){zap(f.x,f.y-500,f.x,f.y,'#fff3a0',7);zap(f.x,f.y-500,f.x,f.y,'#fff',3)}}
  g.globalAlpha=1
}
function overlay(m,w,h){ // screen space: light, minimap, vignette, bars, kill feed, warnings
  if(m.cl==null)return;light(m,w,h);
  const ms=Math.min(150,w*.3),x0=w-ms-10,y0=56,k=ms/2/A,cx=x0+ms/2,cy=y0+ms/2,mp=(x,y)=>[cx+(x-C)*k,cy+(y-C)*k];
  g.save();g.beginPath();g.arc(cx,cy,ms/2,0,7);g.clip();
  g.fillStyle='#10131ccc';g.fillRect(x0,y0,ms,ms);cir(cx,cy,ms/2,'#cdb877');g.drawImage(MC,x0,y0,ms,ms);
  for(const z of Sz){const[a,b]=mp(z.x,z.y);cir(a,b,Math.max(2.5,z.r*k),z.k=='spring'?'#3fc7e8':'#8a5cff')} // live pads
  
  
  if(md==0){g.fillStyle='#ff1e1e66';g.beginPath();g.rect(x0,y0,ms,ms);g.moveTo(cx+zr*k,cy);g.arc(cx,cy,zr*k,0,7);g.fill('evenodd')}
  if(md==2&&hz){const[a,b]=mp(hz.x,hz.y);cir(a,b,170*k,'#ffd23f88')}
  for(const p of P)if(p.hp>0&&p!==m&&seen(p,m)){const[a,b]=mp(p.x,p.y);cir(a,b,3.5,'#ff4d4d')} // only enemies you can actually see
  const[a,b]=mp(m.x,m.y);g.strokeStyle='#ffffff55';g.lineWidth=1;g.beginPath();g.arc(a,b,V*k,0,7);g.stroke();
  g.translate(a,b);g.rotate(m.a);g.fillStyle='#fff';g.beginPath();g.moveTo(7,0);g.lineTo(-4,4.5);g.lineTo(-4,-4.5);g.fill();
  g.restore();g.strokeStyle='#fffa';g.lineWidth=2;g.beginPath();g.arc(cx,cy,ms/2,0,7);g.stroke();
  const hf=Math.max(0,m.hp)/CL[m.cl].hp;let vv=vg;
  if(m===P[me]&&hf<.3&&m.hp>0)vv=Math.max(vv,.15+.1*Math.sin(performance.now()/180));
  if(vv>0){const q=g.createRadialGradient(w/2,h/2,Math.min(w,h)*.3,w/2,h/2,Math.max(w,h)*.75);q.addColorStop(0,'rgba(255,30,30,0)');q.addColorStop(1,'rgba(255,30,30,'+vv+')');g.fillStyle=q;g.fillRect(0,0,w,h)}
  const bw=Math.min(240,w*.5),bx=(w-bw)/2,by=h-38; // health + ultimate bars
  g.fillStyle='#000a';g.fillRect(bx-2,by-2,bw+4,18);g.fillStyle=hf>.35?'#4cff7a':'#ff4d4d';g.fillRect(bx,by,bw*hf,14);
  g.fillStyle='#fff';g.font='bold 12px sans-serif';g.textAlign='center';g.fillText(Math.ceil(Math.max(0,m.hp)),w/2,by+12);
  g.fillStyle='#000a';g.fillRect(bx-2,by+18,bw+4,10);g.fillStyle=m.ch>=100?'#ff7ac6':'#a64d8a';g.fillRect(bx,by+20,bw*Math.min(1,m.ch/100),6);
  g.textAlign='left';g.font='bold 14px sans-serif';g.lineWidth=3;g.strokeStyle='#000';
  KF.forEach((f,i)=>{g.globalAlpha=Math.min(1,f.t);g.strokeText(f.s,10,84+i*20);g.fillStyle='#fff';g.fillText(f.s,10,84+i*20)});g.globalAlpha=1;
  if(md==0&&m.hp>0&&Math.hypot(m.x-C,m.y-C)>zr){g.textAlign='center';g.font='bold 22px sans-serif';g.fillStyle='#ff6b6b';g.globalAlpha=.6+.4*Math.sin(performance.now()/150);g.fillText('IN THE STORM! Get inside the circle',w/2,h*.2);g.globalAlpha=1}
  if(flash>0){g.fillStyle='rgba(255,255,255,'+Math.min(.7,flash)+')';g.fillRect(0,0,w,h)}
  if(KO>0){g.save();g.globalAlpha=Math.min(1,KO*2);g.font='900 '+(56+20*Math.max(0,KO-1))+'px system-ui';g.textAlign='center';g.lineWidth=8;g.strokeStyle=OL;g.fillStyle='#ffd23f';g.strokeText('KO!',w/2,h*.3);g.fillText('KO!',w/2,h*.3);g.restore()}
}
function draw(){
  const w=cv.width=innerWidth,h=cv.height=innerHeight,s=Math.min(w,h)/650,m=cam();
  fx(DT);
  g.fillStyle='#10131c';g.fillRect(0,0,w,h);
  g.save();g.translate(w/2+(Math.random()-.5)*shk,h/2+(Math.random()-.5)*shk);g.scale(s,s);g.translate(-m.x,-m.y);
  g.fillStyle='#cdb877';g.beginPath();g.arc(C,C,A,0,7);g.fill();cir(C,C,A-60,'#3c5a3c');
  ground(m,w,h,s);
  if(md==2&&hz){g.fillStyle='#ffd23f33';g.strokeStyle='#ffd23f';g.lineWidth=6;g.beginPath();g.arc(hz.x,hz.y,170,0,7);g.fill();g.stroke()}
  g.fillStyle='#9c8461';for(const q of Bd)g.fillRect(q.x,q.y,q.w,q.h);
  bushes();walls();roofs(m);
  g.textAlign='center';
  P.forEach((p,i)=>{
    if(p.hp<=0||i!=me&&!seen(p,m))return;
    if(p.fl&2)g.globalAlpha=.4;
    person(p,i==me);
    if(p.hf>0){g.globalAlpha=Math.min(.7,p.hf*6);cir(p.x,p.y,21,'#fff');g.globalAlpha=p.fl&2?.4:1}
    g.fillStyle='#000a';g.fillRect(p.x-22,p.y-34,44,7);g.fillStyle=p.hp>CL[p.cl].hp*.35?'#4cff7a':'#ff4d4d';g.fillRect(p.x-22,p.y-34,44*p.hp/CL[p.cl].hp,7);
    g.fillStyle='#fff';g.font='bold 14px sans-serif';g.fillText(p.n,p.x,p.y-40);g.globalAlpha=1;
  });
  if(m===P[me]&&m.hp>0&&inBush(m)&&!(m.fl&16)){g.font='bold 13px sans-serif';g.lineWidth=3;g.strokeStyle='#000';g.fillStyle='#b8ffb8';g.strokeText('hidden',m.x,m.y+46);g.fillText('hidden',m.x,m.y+46)}
  drawFx();
  if(md==0){g.fillStyle='#ff1e1e55';g.beginPath();g.rect(-600,-600,W+1200,W+1200);g.moveTo(C+zr,C);g.arc(C,C,zr,0,7);g.fill('evenodd');
    g.strokeStyle='#ff4d4d';g.lineWidth=4;g.beginPath();g.arc(C,C,zr,0,7);g.stroke()}
  g.restore();
  overlay(m,w,h);
  g.lineWidth=3; // touch sticks
  for(const k of['m','a']){const j=tch[k];if(!j)continue;g.strokeStyle='#fff6';g.beginPath();g.arc(j.x,j.y,50,0,7);g.stroke();cir(j.x+tch[k+'x']*50,j.y+tch[k+'y']*50,22,'#fff6')}
}
function hud(){
  const p=P[me],al=P.filter(q=>q.hp>0).length,top=Math.max(...P.map(q=>md==2?q.pt|0:q.k));
  $('b1').textContent=p&&p.ac>0?Math.ceil(p.ac):'Q';$('b2').textContent=p?(p.ch>=100?'E!':(p.ch|0)+'%'):'E';
  $('b2').style.outline=p&&p.ch>=100?'4px solid #ff7ac6':'';
  $('lv').style.display=p&&p.hp<=0?'block':'none';
  const dead=p&&p.hp<=0&&md==0; // Showdown: eliminated players can watch the others
  $('sp').style.display=dead?'flex':'none';
  if(dead){if(!P[spec]||P[spec].hp<=0||spec==me)cyc(1);if(P[spec])$('spN').textContent='Watching: '+P[spec].n}
  $('hud').textContent=(md==0?'Alive '+al+' · ':md==1?'First to 10 kills (best '+top+') · ':'Hold the zone (best '+top+'/100) · ')+'Kills '+(p?p.k:0)+(md==2?' · Points '+(p?p.pt|0:0):'')+
    ' · '+(p&&p.hp>0?'HP '+Math.ceil(p.hp):md?'Respawning...':'Spectating')+(md==0&&zt<20&&host?' · Storm in '+Math.ceil(20-zt)+'s':'');
}

// ---------- 12. Input (keyboard + mouse, or twin touch sticks) ----------
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=1;if(k=='q'||k==' ')pq=1;if(k=='e')pu=1;
  if(st=='play'&&md==0&&P[me]&&P[me].hp<=0){if(k=='arrowleft'||k=='a')cyc(-1);if(k=='arrowright'||k=='d')cyc(1)}});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
function cyc(d){ // spectate the next / previous living player
  const al=P.map((p,i)=>i).filter(i=>P[i].hp>0&&i!=me);if(!al.length)return;
  const k=al.indexOf(spec);spec=al[(k<0?(d>0?0:al.length-1):k+d+al.length)%al.length]}
$('spL').onclick=()=>cyc(-1);$('spR').onclick=()=>cyc(1);
$('b1').onpointerdown=()=>pq=1;$('b2').onpointerdown=()=>pu=1;
addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
addEventListener('mousedown',e=>{if(!tch.on&&e.target.tagName!='BUTTON')mouse.d=1});
addEventListener('mouseup',()=>mouse.d=0);
addEventListener('touchstart',e=>{
  tch.on=1;if(st!='play')return;
  for(const t of e.changedTouches){if(t.target.tagName=='BUTTON')continue;const k=t.clientX<innerWidth/2?'m':'a';if(!tch[k])tch[k]={id:t.identifier,x:t.clientX,y:t.clientY}}
});
addEventListener('touchmove',e=>{
  for(const t of e.changedTouches)for(const k of['m','a']){
    const j=tch[k];if(!j||j.id!=t.identifier)continue;
    let dx=(t.clientX-j.x)/50,dy=(t.clientY-j.y)/50;const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}
    tch[k+'x']=dx;tch[k+'y']=dy;
  }
});
const tend=e=>{for(const t of e.changedTouches)for(const k of['m','a'])if(tch[k]&&tch[k].id==t.identifier){tch[k]=null;tch[k+'x']=tch[k+'y']=0}};
addEventListener('touchend',tend);addEventListener('touchcancel',tend);
function input(){
  let mx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),my=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
  let a=Math.atan2(mouse.y-innerHeight/2,mouse.x-innerWidth/2),f=mouse.d;
  if(tch.m){mx=tch.mx;my=tch.my}
  if(tch.a){a=Math.atan2(tch.ay,tch.ax);f=Math.hypot(tch.ax,tch.ay)>.15?1:0}
  return{mx,my,a,f};
}

// ---------- 13. Main loop ----------
function loop(t){
  DT=Math.min(.05,(t-last)/1000||0);last=t;
  if(st=='play'){
    const I=input();
    if(host){const p=P[me];if(p&&p.hp>0){p.mx=I.mx;p.my=I.my;p.a=I.a;p.f=I.f;p.aq|=pq;p.au|=pu}pq=pu=0;step(DT)}
    else{ // client: smooth toward the latest snapshot, send input at ~30 Hz
      const k=Math.min(1,DT*14);for(const p of P){p.x+=(p.tx-p.x)*k;p.y+=(p.ty-p.y)*k}
      for(const z of Sz)if(z.gx!=null){z.x+=(z.gx-z.x)*k;z.y+=(z.gy-z.y)*k}
      inT+=DT;if(inT>.033&&hc&&hc.open){inT=0;hc.send({t:'i',...I,q:pq,u:pu});pq=pu=0}
    }
    draw();hud();
  }else if(st=='over')draw();
  else g.clearRect(0,0,cv.width,cv.height);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
