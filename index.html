<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Storm Arena</title>
<style>
*{box-sizing:border-box;margin:0;touch-action:none;user-select:none;-webkit-user-select:none}
body{background:#10131c;color:#fff;font:600 16px system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%}
.pn{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#10131cdd;text-align:center;padding:16px}
.pn.h{display:none}
h1{font-size:46px;color:#ffd23f;text-shadow:0 4px 0 #b8860b}
button,input{font:inherit;padding:12px 22px;border-radius:12px;border:0}
button{background:#ffd23f;color:#222;box-shadow:0 4px 0 #b8860b;cursor:pointer}
button:active{transform:translateY(3px);box-shadow:none}
button.s{background:#3b4560;color:#fff;box-shadow:0 4px 0 #222a3d}
input{background:#222a3d;color:#fff;text-align:center;width:220px;user-select:text;-webkit-user-select:text}
#hud{position:fixed;top:8px;left:0;right:0;text-align:center;pointer-events:none;text-shadow:0 2px 3px #000;font-size:18px}
.cl i{display:inline-block;width:32px;height:32px;border-radius:50%;margin:3px;border:3px solid transparent;cursor:pointer}
.cl i.s{border-color:#fff}
#ls div{background:#222a3d;border-radius:8px;padding:6px 18px;margin:3px}
#code{font-size:40px;letter-spacing:6px;color:#ffd23f}
small{opacity:.7;max-width:420px}
select{font:inherit;padding:8px;border-radius:8px;border:0;background:#222a3d;color:#fff}
#set{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:460px}
#set label{font-size:13px;display:flex;flex-direction:column;gap:2px}
.cb button{padding:8px 12px;font-size:14px;margin:2px}
#cs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.cc{width:74px;padding:8px 2px;border-radius:14px;background:#222a3d;border:3px solid transparent;cursor:pointer;font-size:13px}
.cc b{display:block;font-size:30px}.cc.s{border-color:#ffd23f;background:#2f3a55}
#cd{background:#222a3d;border-radius:14px;padding:10px 14px;max-width:440px;text-align:left;font-size:14px;line-height:1.5}
#cd h3{color:#ffd23f}#cd span{display:inline-block;min-width:92px;font-size:11px;font-weight:800;padding:1px 6px;border-radius:6px;margin-right:6px;color:#222;text-align:center}
.ab{display:none;position:fixed;right:10px;top:42%;flex-direction:column;gap:10px}
.ab button{width:64px;height:64px;border-radius:50%;padding:0;font-size:15px}
</style></head><body>
<canvas id="c"></canvas><div id="hud"></div>
<div class="ab" id="ab"><button id="b1">Q</button><button id="b2" class="s">E</button></div>
<button id="lv" class="s" style="position:fixed;left:10px;top:10px;display:none">Leave game</button>

<div class="pn" id="menu">
<h1>STORM ARENA</h1>
<input id="nm" maxlength="12" placeholder="Your name">
<div id="cs"></div><div id="cd"></div>
<button id="bh">Host a room</button>
<div><input id="rc" maxlength="4" placeholder="Room code" style="width:130px;text-transform:uppercase"> <button id="bj" class="s">Join</button></div>
<small id="mg">Last one standing wins. Move: WASD / left stick. Aim + shoot: mouse / right stick. Hide in bushes, use your ability (Q) and ultimate (E), and stay inside the storm circle. You heal slowly when not being hit.</small>
</div>

<div class="pn h" id="lobby">
<small>Room code</small><div id="code">----</div>
<small id="lk"></small>
<div id="ls"></div>
<div id="set"><label>Players<select id="s1"><option>6<option>8<option selected>10<option>12</select></label><label>Mode<select id="s2"><option value="0">Showdown (battle royale)<option value="1">Brawl Rush (deathmatch, first to 10 kills)<option value="2">Hot Zone (hold the zone)</select></label><label>Bot skill<select id="s4"><option value="0">Easy<option value="1" selected>Mixed<option value="2">Genius</select></label></div>
<button id="bs">Start (bots fill the rest)</button>
<button id="bl1" class="s">Leave</button>
</div>

<div class="pn h" id="end">
<h1 id="et"></h1><div id="es"></div>
<button id="ba">Play again</button>
<button id="bl2" class="s">Leave</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $=id=>document.getElementById(id),cv=$('c'),g=cv.getContext('2d');
const A=2000,W=A*2,C=A,COLS=['#ff4d4d','#4dc3ff','#6bff6b','#ffd23f','#c77dff','#ff9f43','#2ee6c5','#ff7ac6'];
let cls=0,S={n:10,m:0,iq:1},col=0,peer,host=false,hc=null,me=-1,P=[],B=[],R=[],Bu=[],Gp=[],Bd=[],Wl=[],hz=null,md=0,pq=0,pu=0,zr=C,zt=0,st='menu',lobby=[],keys={},mouse={x:0,y:0,d:0},netT=0,inT=0,code='';
const tch={m:null,a:null,mx:0,my:0,ax:0,ay:0,on:0};
// characters: every one has a Main attack, an Ability (Q), an Ultimate (E, charges from fighting) and a Passive
const CL=[
{n:'Jack',t:'Outlaw',i:'🤠',oc:'#b5702f',hr:'#5a3a1e',sk:'#f0c8a0',hs:1,gl:24,hp:100,sp:230,d:20,cd:.45,pl:1,sa:0,bs:750,bt:.8,r:350,fl:.3,
 mn:['Six-Shooter','steady revolver shots'],
 ab:{n:'Dodge Roll',x:'dash where you move',k:'dash',cd:5},
 ul:{n:'Showdown',x:'5s of faster, harder fire',k:'rage',t:5},
 ps:{n:'Bounty Hunter',x:'+30% damage to wounded enemies',k:'exec'}},
{n:'Rosa',t:'Botanist',i:'🌹',oc:'#d6457b',hr:'#8a1c3f',sk:'#f5d0b5',hs:0,gl:30,hp:130,sp:215,d:9,cd:.8,pl:4,sa:.5,bs:700,bt:.4,r:150,fl:.25,
 mn:['Thorn Blast','4-thorn close-range spread'],
 ab:{n:'Bark Skin',x:'take 60% less damage for 2.5s',k:'shield',t:2.5,cd:8},
 ul:{n:'Bloom',x:'thorns burst in all directions',k:'burst',n2:14,arc:6.28,d:12},
 ps:{n:'Deep Roots',x:'heals twice as fast',k:'root'}},
{n:'Nina',t:'Huntress',i:'🏹',oc:'#3f8f5a',hr:'#2d6a42',sk:'#e0b48f',hs:2,gl:40,hp:70,sp:215,d:45,cd:1.2,pl:1,sa:0,bs:1200,bt:.9,r:550,fl:.45,
 mn:['Longbow','slow, hard-hitting arrow'],
 ab:{n:'Smoke Veil',x:'vanish from sight for 3s',k:'veil',t:3,cd:9},
 ul:{n:'Deadeye',x:'next 2 shots deal triple damage',k:'crit'},
 ps:{n:'Ambusher',x:'+40% damage when shooting from a bush',k:'amb'}},
{n:'Leo',t:'Courier',i:'⚡',oc:'#f2c230',hr:'#2b2b2b',sk:'#c98f60',hs:3,gl:20,z:.95,hp:85,sp:285,d:9,cd:.2,pl:1,sa:.15,bs:800,bt:.55,r:230,fl:.3,
 mn:['Pocket SMG','fast spray'],
 ab:{n:'Sprint',x:'+60% speed for 2.5s',k:'haste',t:2.5,cd:7},
 ul:{n:'Bullet Rush',x:'unload a cone of bullets',k:'burst',n2:16,arc:.9,d:10},
 ps:{n:'Adrenaline',x:'+30% speed below half health',k:'adr'}},
{n:'Bruno',t:'Bouncer',i:'🐻',oc:'#56607f',hr:'#1f1f1f',sk:'#b57a54',hs:0,gl:22,z:1.25,hp:200,sp:165,d:16,cd:.5,pl:1,sa:0,bs:700,bt:.7,r:250,fl:.2,
 mn:['Heavy Pistol','reliable mid-range shots'],
 ab:{n:'Ground Pound',x:'slam nearby enemies: damage + slow',k:'aoe',cd:8},
 ul:{n:'Fortress',x:'60% less damage for 5s, heal 35',k:'shield',t:5,heal:35},
 ps:{n:'Iron Will',x:'always take 15% less damage',k:'thick'}}];
// bot names by intelligence: dumb, average, genius
const NM=[['Goofball','Noodle','Potato','Derp','Bonkers','Muffin','Doofus','Clumsy'],['Sam','Max','Rex','Dave','Pete','Lou','Gus','Bob'],['Socrates','Einstein','Newton','Tesla','Plato','Curie','Darwin','Hawking']];

// ---------- UI ----------
const show=id=>{['menu','lobby','end'].forEach(x=>$(x).classList.toggle('h',x!=id));$('ab').style.display=id?'none':'flex';$('lv').style.display='none'};
const msg=t=>{$('mg').textContent=t;show('menu')};
$('rc').value=(new URLSearchParams(location.search).get('room')||'').toUpperCase();
const row=(l,c,n,x)=>'<div><span style="background:'+c+'">'+l+'</span><b>'+n+'</b> — '+x+'</div>';
const cdesc=c=>'<h3>'+c.i+' '+c.n+', '+c.t+'</h3><div style="opacity:.8;margin-bottom:4px">❤ '+c.hp+' HP · 👟 '+(c.sp>260?'Fast':c.sp<190?'Slow':'Normal')+'</div>'+row('MAIN','#ffd23f',c.mn[0],c.mn[1])+row('ABILITY (Q)','#6ee7ff',c.ab.n,c.ab.x)+row('ULTIMATE (E)','#ff7ac6',c.ul.n,c.ul.x)+row('PASSIVE','#9dff8a',c.ps.n,c.ps.x);
function pick(i){cls=i;[...$('cs').children].forEach((x,j)=>x.classList.toggle('s',j==i));$('cd').innerHTML=cdesc(CL[i])}
CL.forEach((c,i)=>{const d=document.createElement('div');d.className='cc';d.innerHTML='<b>'+c.i+'</b>'+c.n;d.onclick=()=>pick(i);$('cs').appendChild(d)});pick(0);
const nm=()=>($('nm').value.trim()||'Player'+(Math.random()*90+10|0)).slice(0,12);
function drawLobby(){const l=$('ls');l.textContent='';lobby.forEach(x=>{const d=document.createElement('div');d.textContent=x.n;l.appendChild(d)});$('code').textContent=code;$('bs').style.display=$('set').style.display=host?'':'none'}
function sendLobby(){drawLobby();bc({t:'l',l:lobby.map(x=>x.n)})}
function bc(m){lobby.forEach(l=>l.conn&&l.conn.open&&l.conn.send(m))}
function leave(){location.href=location.pathname}

// ---------- networking ----------
$('bh').onclick=()=>{host=true;mk()};
function mk(){
  code=Math.random().toString(36).slice(2,6).toUpperCase();
  peer=new Peer('storm-'+code);
  peer.on('error',e=>{if(e.type=='unavailable-id')mk();else msg('Network error: '+e.type)});
  peer.on('open',()=>{
    lobby=[{n:nm(),c:col,k:cls}];st='lobby';show('lobby');
    $('lk').textContent=location.origin+location.pathname+'?room='+code;drawLobby();
    peer.on('connection',c=>{
      c.on('data',m=>{
        if(m.t=='j'&&st=='lobby'&&lobby.length<+$('s1').value){lobby.push({n:String(m.n).slice(0,12),c:m.c&7,k:m.k>=0&&m.k<CL.length?m.k|0:0,conn:c});sendLobby()}
        else if(m.t=='i'&&c.pi!=null&&P[c.pi]){const p=P[c.pi];p.mx=+m.mx||0;p.my=+m.my||0;p.a=+m.a||0;p.f=m.f?1:0;if(m.q)p.aq=1;if(m.u)p.au=1}
      });
      c.on('close',()=>{lobby=lobby.filter(l=>l.conn!=c);if(st=='lobby')sendLobby();else if(c.pi!=null&&P[c.pi])P[c.pi].hp=0});
    });
  });
}
$('bj').onclick=()=>{
  const rc=$('rc').value.trim().toUpperCase();if(!rc)return;
  host=false;code=rc;peer=new Peer();
  peer.on('error',e=>msg(e.type=='peer-unavailable'?'Room not found':'Network error: '+e.type));
  peer.on('open',()=>{
    hc=peer.connect('storm-'+rc,{reliable:true});
    hc.on('open',()=>{hc.send({t:'j',n:nm(),c:col,k:cls});st='lobby';lobby=[];show('lobby');$('lk').textContent='';drawLobby()});
    hc.on('data',onData);
    hc.on('close',()=>{if(st!='menu')msg('Host left the game')});
  });
};
function onData(m){
  if(m.t=='l'){lobby=m.l.map(n=>({n}));if(st!='lobby'){st='lobby';show('lobby')}drawLobby()}
  else if(m.t=='s'){world(m.seed);P=m.ps.map(p=>({...p,x:0,y:0,tx:0,ty:0,a:0,hp:CL[p.cl].hp,k:0,fl:0,ac:0,ch:0,pt:0,first:1}));me=m.you;md=m.md;hz=null;B=[];zr=C;st='play';show(null)}
  else if(m.t=='u'&&st=='play'){
    m.p.forEach((a,i)=>{const p=P[i];p.tx=a[0];p.ty=a[1];if(p.first){p.x=p.tx;p.y=p.ty;p.first=0}p.a=a[2];p.hp=a[3];p.k=a[4];p.fl=a[5];p.ac=a[6];p.ch=a[7];p.pt=a[8]});
    B=m.b.map(a=>({x:a[0],y:a[1]}));zr=m.z;hz=m.h?{x:m.h[0],y:m.h[1]}:null;
  }
  else if(m.t=='e')finish(m.w);
}
$('bl1').onclick=$('bl2').onclick=$('lv').onclick=leave;

// ---------- world ----------
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const inBush=q=>Bu.some(b=>Math.hypot(b.x-q.x,b.y-q.y)<b.r);
const hid=q=>!(q.fl&16)&&((q.fl&2)||inBush(q)); // hidden in a bush / smoke unless it just shot
const inB=q=>Bd.some(b=>q.x>b.x&&q.x<b.x+b.w&&q.y>b.y&&q.y<b.y+b.h);
function bld(x,y,w,h,ew){ // building: walls with a door gap in two opposite walls
  const t=22,dg=96;Bd.push({x,y,w,h});
  const hw=(yy,gap)=>{if(!gap)Wl.push({x,y:yy,w,h:t});else{const m=(w-dg)/2;Wl.push({x,y:yy,w:m,h:t},{x:x+m+dg,y:yy,w:m,h:t})}};
  const vw=(xx,gap)=>{const L=h-2*t;if(!gap)Wl.push({x:xx,y:y+t,w:t,h:L});else{const m=(L-dg)/2;Wl.push({x:xx,y:y+t,w:t,h:m},{x:xx,y:y+t+m+dg,w:t,h:m})}};
  hw(y,!ew);hw(y+h-t,!ew);vw(x,ew);vw(x+w-t,ew);
}
function world(seed){
  const r=rng(seed),pt=(d,m)=>{let x,y,t=0;do{const a=r()*6.283,q=Math.sqrt(r())*d;x=C+Math.cos(a)*q;y=C+Math.sin(a)*q}while(m&&Bd.some(b=>Math.hypot(b.x+b.w/2-x,b.y+b.h/2-y)<m)&&++t<30);return[x,y]};
  R=[];Bu=[];Gp=[];Bd=[];Wl=[];
  for(let i=0;i<10;i++){const[x,y]=pt(A-450),w=300+(r()*100|0),h=230+(r()*70|0),ew=r()<.5;if(!Bd.some(b=>Math.hypot(b.x+b.w/2-x,b.y+b.h/2-y)<520))bld(x-w/2,y-h/2,w,h,ew)} // buildings
  for(let i=0;i<9;i++){const[x,y]=pt(A-600,430),q=90+r()*80;if(Math.hypot(x-C,y-C)>300)R.push({x,y,r:q,w:1})} // ponds: block walking, not bullets
  for(let i=0;i<20;i++){const[x,y]=pt(A-250,330),n=4+(r()*3|0);for(let j=0;j<n;j++){const a=j/n*6.283+r()*.4;R.push({x:x+Math.cos(a)*62,y:y+Math.sin(a)*62,r:22+r()*16})}} // ruined stone rings
  for(let i=0;i<16;i++){const[x,y]=pt(A-250,300);for(let j=0;j<4;j++)Bu.push({x:x+(r()-.5)*150,y:y+(r()-.5)*150,r:48+r()*25})} // bush clumps
  for(let i=0;i<12;i++){const[x,y]=pt(A-100,0);Gp.push({x,y,r:120+r()*160})}
}

// ---------- host simulation ----------
$('bs').onclick=()=>{
  if(!host||st!='lobby')return;
  S={n:+$('s1').value,m:+$('s2').value,iq:+$('s4').value};
  const list=[...lobby],pool=NM.map(l=>[...l]);let b=0;
  while(list.length<S.n){const iq=S.iq==0?Math.random()*.4:S.iq==2?.6+Math.random()*.4:Math.random(),L=pool[iq>.66?2:iq>.33?1:0];list.push({n:L.splice(Math.random()*L.length|0,1)[0]||'Bot'+ ++b,c:Math.random()*8|0,k:Math.random()*CL.length|0,bot:1,iq})}
  list.sort(()=>Math.random()-.5);
  const seed=Math.random()*1e9|0,n=list.length;world(seed);
  P=list.map((l,i)=>{const a=i/n*6.283;return{n:l.n,c:l.c,cl:l.k,iq:l.iq,bot:l.bot,conn:l.conn,x:C+Math.cos(a)*(A-120),y:C+Math.sin(a)*(A-120),a:a+3.14,hp:CL[l.k].hp,k:0,cd:0,mx:0,my:0,f:0,s:'search',rt:0,sd:1,aj:0,tg:-1,dest:{x:C,y:C},sh:0,hs:0,vl:0,rg:0,dh:0,sl:0,ac:0,rv:0,rl:0,cr:0,ch:0,aq:0,au:0,fl:0,pt:0,dd:0}});
  P.forEach((p,i)=>{if(p.conn){p.conn.pi=i;p.conn.send({t:'s',seed,ps:P.map(q=>({n:q.n,c:q.c,cl:q.cl})),md:S.m,you:i})}else if(!p.bot)me=i});
  B=[];zt=0;zr=C;md=S.m;hz=md==2?{x:C,y:C,t:0}:null;st='play';show(null);
};
function hit(p,d,by){
  if(p.hp<=0)return;
  if(by!=null){if(p.sh>0)d*=.4;if(CL[p.cl].ps.k=='thick')d*=.85;p.ch=Math.min(100,p.ch+d*.4);if(P[by]&&P[by]!==p)P[by].ch=Math.min(100,P[by].ch+d*.8)}
  p.hp-=d;p.rl=4;
  if(p.hp<=0&&by!=null&&P[by])P[by].k++;
}
function respawn(p){const a=Math.random()*6.283,q=Math.sqrt(Math.random())*(A-250);p.x=C+Math.cos(a)*q;p.y=C+Math.sin(a)*q;p.hp=CL[p.cl].hp;p.sh=2;p.rl=0;p.sl=0;p.vl=0;p.ch=0}
function cast(p,i,u){
  const k=u.k;
  if(k=='dash')p.dh=.2;else if(k=='haste')p.hs=u.t;
  else if(k=='shield'){p.sh=u.t;if(u.heal)p.hp=Math.min(CL[p.cl].hp,p.hp+u.heal)}
  else if(k=='veil')p.vl=u.t;else if(k=='rage')p.rg=u.t;else if(k=='crit')p.cr=2;
  else if(k=='burst')for(let n=0;n<u.n2;n++){const a=p.a+(u.arc>6?n/u.n2*6.283:(n/(u.n2-1)-.5)*u.arc);B.push({x:p.x,y:p.y,vx:Math.cos(a)*600,vy:Math.sin(a)*600,o:i,t:.7,d:u.d})}
  else if(k=='aoe')for(const q of P)if(q!==p&&q.hp>0&&Math.hypot(q.x-p.x,q.y-p.y)<130){hit(q,25,i);q.sl=2}
}
function ai(p,i,dt){
  const c=CL[p.cl],dist=q=>Math.hypot(q.x-p.x,q.y-p.y),dc=Math.hypot(p.x-C,p.y-C),vis=q=>q&&q.hp>0&&!(hid(q)&&dist(q)>200);
  p.rt-=dt;
  if(p.rt<=0){ // think: slower for dumb bots; target + state only change here, so no per-frame flip-flopping
    p.rt=.15+(1-p.iq)*.5;p.aj=(Math.random()-.5)*(1-p.iq)*.6;if(Math.random()<.3)p.sd=-p.sd;
    const cur=P[p.tg],cdi=vis(cur)?dist(cur):1e9;let best=null,bd=1e9;
    for(const q of P)if(q!==p&&vis(q)){const d=dist(q);if(d<bd){bd=d;best=q}}
    if(best&&(cdi>900||bd<cdi*.7))p.tg=P.indexOf(best); // sticky target: only switch if the new one is much closer
    const t=P[p.tg],td=vis(t)?dist(t):1e9,see=450+p.iq*450,hf=p.hp/c.hp;
    if(td<see)p.lk={x:t.x,y:t.y};
    let pk=null,pd=300+p.iq*500;for(const k of Bu){const d=dist(k);if(d<pd){pd=d;pk=k}}
    let s='search';
    if(!S.m&&dc>zr-40-p.iq*220)s='storm';
    else if(td<see&&hf<c.fl*(.5+p.iq))s='flee';
    else if(pk&&hf<.6&&td>350&&p.iq>.25)s='hide'; // hurt: sneak into a bush and heal
    else if(td<see)s='chase';
    if(s=='storm'&&p.s!='storm')p.dest={x:C+(Math.random()-.5)*150,y:C+(Math.random()-.5)*150};
    if(s=='hide')p.dest={x:pk.x,y:pk.y};
    if(s=='search'&&(p.s!='search'||dist(p.dest)<60)){
      if(p.lk&&p.iq>.4){p.dest=p.lk;p.lk=null}
      else{const a=Math.random()*6.28,r=Math.sqrt(Math.random())*zr*.7;p.dest={x:C+Math.cos(a)*r,y:C+Math.sin(a)*r}}
    }
    if(S.m==2&&s=='search')p.dest={x:hz.x+(Math.random()-.5)*220,y:hz.y+(Math.random()-.5)*220};
    p.s=s;
  }
  const t=P[p.tg],ok=vis(t),td=ok?dist(t):1e9,rg=c.bs*c.bt,b=ok?Math.atan2(t.y-p.y,t.x-p.x):0;
  let mx=0,my=0,a=p.a;p.f=0;
  const aim=()=>{const v=CL[t.cl].sp*p.iq*td/c.bs;a=Math.atan2(t.y+t.my*v-p.y,t.x+t.mx*v-p.x)+p.aj;p.f=td<rg*.95?1:0}; // smart bots lead their shots
  if(p.s=='chase'&&ok){
    const m=td>c.r*1.15?1:td<c.r*.7?-1:0,sd=p.sd*p.iq*.8; // hold the class's preferred range, strafe if smart

function step(dt){

    if(p.f&&p.cd<=0){const dm=c.d*(p.rg>0?1.5:1)*(p.cr>0?3:1)*(c.ps.k=='amb'&&inBush(p)?1.4:1);p.cd=c.cd*(p.rg>0?.6:1);if(p.cr>0)p.cr--;p.rv=.8;for(let n=0;n<c.pl;n++){const a=p.a+(c.pl>1?(n/(c.pl-1)-.5)*c.sa:(Math.random()-.5)*c.sa);B.push({x:p.x,y:p.y,vx:Math.cos(a)*c.bs,vy:Math.sin(a)*c.bs,o:i,t:c.bt,d:dm})}}
    if(p.aq){p.aq=0;if(p.ac<=0){cast(p,i,c.ab);p.ac=c.ab.cd}}
    if(p.au){p.au=0;if(p.ch>=100){cast(p,i,c.ul);p.ch=0}}
    for(const k of['sh','hs','vl','rg','dh','sl','ac','rv','rl'])p[k]=Math.max(0,p[k]-dt);

  });

    b.x+=b.vx*dt;b.y+=b.vy*dt;b.t-=dt;if(b.t<=0)return false;

<script>
/* Storm Arena upgrade: smarter AI, fog of war, minimap, feedback, sfx */
(()=>{

// ---------- map awareness ----------
const gb=(x,y)=>x<0||y<0||x>=W||y>=W||Gb[(y/GS|0)*GN+(x/GS|0)];
function grid(){ // walkable grid: blocks walls, rocks, ponds and the arena rim (inflated for the player's body)
  Gb=new Uint8Array(GN*GN);

    Gb[j*GN+i]=Math.hypot(x-C,y-C)>A-40||R.some(r=>Math.hypot(x-r.x,y-r.y)<r.r+26)||Wl.some(w=>x>w.x-26&&x<w.x+w.w+26&&y>w.y-26&&y<w.y+w.h+26)?1:0}

function gc(x0,y0,x1,y1){const n=Math.ceil(Math.hypot(x1-x0,y1-y0)/12);for(let i=1;i<=n;i++)if(gb(x0+(x1-x0)*i/n,y0+(y1-y0)*i/n))return 0;return 1}

  const cl=v=>Math.max(0,Math.min(GN-1,v/GS|0)),s=cl(sy)*GN+cl(sx),e=cl(gy)*GN+cl(gx),ex=e%GN,ey=e/GN|0,q=[s];

    for(let k=0;k<8;k++){const nx=cx+DX[k],ny=cy+DY[k];if(nx<0||ny<0||nx>=GN||ny>=GN)continue;const n=ny*GN+nx;

function nav(p,gx,gy){ // unit vector toward (gx,gy), following a wall-free path

    const a=p.pa;while(p.pw<a.length-1&&gc(p.x,p.y,a[p.pw+1][0],a[p.pw+1][1]))p.pw++;

function rayR(ox,oy,dx,dy,L){ // distance along a unit ray to the nearest wall (or L)

    if(dx){let u=(w.x-ox)/dx,v=(w.x+w.w-ox)/dx;if(u>v){const s=u;u=v;v=s}if(u>t0)t0=u;if(v<t1)t1=v}else if(ox<w.x||ox>w.x+w.w)continue;

}
function los(ax,ay,bx,by,rk){ // line of sight; rk=1 also blocks on rocks (what bullets can't pass)

  if(rk)for(const r of R)if(!r.w){const t=Math.max(0,Math.min(L,((r.x-ax)*dx+(r.y-ay)*dy)/L));if(Math.hypot(ax+dx/L*t-r.x,ay+dy/L*t-r.y)<r.r)return 0}
  return 1
}
const seen=(p,m)=>{if(p===m)return 1;const d=Math.hypot(p.x-m.x,p.y-m.y);return d<V&&!(hid(p)&&d>130)&&!(inB(p)&&!inB(m))&&los(m.x,m.y,p.x,p.y)};
const cm=()=>{const m=P[me]||{x:C,y:C,hp:1};return m.hp<=0?P.find(p=>p.hp>0)||m:m};

// ---------- sfx ----------
const au=()=>{if(!AC)try{AC=new(window.AudioContext||window.webkitAudioContext)();NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){}};
['pointerdown','keydown'].forEach(e=>addEventListener(e,()=>{au();if(AC&&AC.state=='suspended')AC.resume()}));
addEventListener('click',e=>{if(e.target.tagName=='BUTTON')sfx('click')});
function tn(f,e,d,ty,v,dl){if(!AC)return;const t=AC.currentTime+(dl||0),o=AC.createOscillator(),k=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(e,t+d);k.gain.setValueAtTime(v,t);k.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(k);k.connect(AC.destination);o.start(t);o.stop(t+d)}
function nz(d,v,f){if(!AC)return;const t=AC.currentTime,s=AC.createBufferSource(),b=AC.createBiquadFilter(),k=AC.createGain();s.buffer=NB;b.type='bandpass';b.frequency.value=f;k.gain.setValueAtTime(v,t);k.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(b);b.connect(k);k.connect(AC.destination);s.start(t);s.stop(t+d)}
const SF={
  shot:(q,c)=>{const f=[520,420,300,760,200][c|0];tn(f,f/5,.1,'square',q*.18);nz(.07,q*.5,2200)},
  hit:q=>{tn(200,60,.1,'sawtooth',q*.3);nz(.05,q*.4,900)},
  hurt:()=>{tn(130,40,.22,'sawtooth',.3);nz(.12,.5,500)},
  ab:q=>{tn(300,1000,.2,'sine',q*.3);nz(.15,q*.3,3000)},
  ult:q=>{tn(110,900,.5,'sawtooth',q*.25);tn(70,30,.6,'sine',q*.6);nz(.5,q*.6,600)},
  die:q=>{tn(320,40,.45,'sawtooth',q*.3);nz(.3,q*.6,400)},
  ready:()=>{tn(660,660,.12,'sine',.2);tn(990,990,.2,'sine',.2,.1)},
  tick:()=>tn(900,700,.05,'square',.08),
  click:()=>tn(600,400,.06,'square',.1),
  win:()=>[523,659,784,1047].forEach((f,i)=>tn(f,f,.3,'triangle',.25,i*.13)),
  lose:()=>[392,330,262,196].forEach((f,i)=>tn(f,f*.97,.3,'sawtooth',.12,i*.18))};
const sfx=(k,x,y,c)=>{if(mut||!AC)return;const q=x==null?1:Math.max(0,1-Math.hypot(x-lx,y-ly)/850);if(q>.04)SF[k](q,c)};

// ---------- feedback ----------
const pf=(x,y,n,c,sp,l,r)=>{for(let i=0;i<n;i++){const a=Math.random()*6.283,v=sp*(.3+Math.random()*.7);FX.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:l,l,c,r})}},
  ri=(x,y,c,R0,l)=>FX.push({x,y,t:l,l,c,R:R0}),
  ft=(x,y,q,c,s)=>FX.push({x,y,vy:-50,t:.9,l:.9,q:String(q),c,s});
function fx(dt){ // derives all effects from state changes, so host and clients get identical feedback
  if(!P.length)return;
  const m=cm();lx=m.x;ly=m.y;shk=Math.max(0,shk-50*dt);vg=Math.max(0,vg-1.2*dt);
  for(const f of FX){f.t-=dt;f.x+=(f.vx||0)*dt;f.y+=(f.vy||0)*dt}
  FX=FX.filter(f=>f.t>0);for(const f of KF)f.t-=dt;KF=KF.filter(f=>f.t>0);
  const kr=P.find(q=>q._h!=null&&q.k>q._k);
  P.forEach((p,i)=>{
    if(p._h==null){p._h=p.hp;p._k=p.k;p._s=p.sc|0;p._f=p.fl|0;p._a=p.ac;p._c=p.ch;p.hf=0;p.da=0}
    const sn=i==me||seen(p,m),d=p._h-p.hp,c=CL[p.cl],F=p.fl|0,dc=i==me?'#ff6b6b':'#ffe066';
    p.hf=Math.max(0,p.hf-dt);
    if(d>0&&sn){p.hf=.12;
      if(d>=2.5){ft(p.x,p.y-38,Math.round(d),dc,d>=30?24:17);p.da=0}
      else if((p.da+=d)>=4){ft(p.x,p.y-38,Math.round(p.da),dc,15);p.da=0}
      pf(p.x,p.y,Math.min(9,3+d/5|0),i==me?'#ff4d4d':'#fff',220,.3,4);sfx(i==me?'hurt':'hit',p.x,p.y);
      if(i==me){shk=Math.min(16,shk+2+d*.3);vg=Math.min(.55,vg+.3)}}
    if(p._h>0&&p.hp<=0){
      if(sn){pf(p.x,p.y,26,COLS[p.c&7],340,.7,7);ri(p.x,p.y,'#fff',90,.5)}
      sfx('die',p.x,p.y);if(i==me)shk=18;
      KF.unshift({s:kr&&kr!==p?kr.n+'  \u279c  '+p.n:p.n+' was eliminated',t:5});KF.length=Math.min(KF.length,5)}
    if(p._h<=0&&p.hp>0&&sn)ri(p.x,p.y,'#fff',70,.5);
    if(p.sc>p._s){const z=c.z||1,tx=p.x+Math.cos(p.a)*(8+c.gl)*z,ty=p.y+Math.sin(p.a)*(8+c.gl)*z;
      if(sn){pf(tx,ty,3,'#ffd23f',260,.12,5);FX.push({x:tx,y:ty,t:.06,l:.06,c:'#fff',r:9})}sfx('shot',p.x,p.y,p.cl)}
    if(p.ac>0&&!p._a){if(sn)ri(p.x,p.y,'#6ee7ff',c.ab.k=='aoe'?130:55,.45);sfx('ab',p.x,p.y)}
    if(p.hp>0&&p._h>0&&p._c-p.ch>50){if(sn){ri(p.x,p.y,'#ff7ac6',170,.6);pf(p.x,p.y,18,'#ff7ac6',320,.6,6);shk=Math.max(shk,8)}sfx('ult',p.x,p.y)}
    if(i==me&&p.ch>=100&&p._c<100){sfx('ready');ft(p.x,p.y-50,'ULTIMATE READY!','#ff7ac6',18)}
    if(F&2&&!(p._f&2)&&sn)pf(p.x,p.y,14,'#9aa5b5',120,.8,12);
    p._h=p.hp;p._k=p.k;p._s=p.sc|0;p._f=F;p._a=p.ac;p._c=p.ch});
  const q=P[me];if(md==0&&q&&q.hp>0&&Math.hypot(q.x-C,q.y-C)>zr){stt-=dt;if(stt<=0){stt=.7;sfx('tick');vg=Math.max(vg,.2)}}
}

// ---------- rendering (called from the patched draw) ----------
function drawFx(){
  const q=P[me];
  if(q&&q.hp>0){const c=CL[q.cl],dx=Math.cos(q.a),dy=Math.sin(q.a),M=c.bs*c.bt,L=Math.min(M,rayR(q.x,q.y,dx,dy,M));
    g.strokeStyle='#ffffff40';g.lineWidth=2;g.setLineDash([10,10]);g.beginPath();g.moveTo(q.x+dx*30,q.y+dy*30);g.lineTo(q.x+dx*L,q.y+dy*L);g.stroke();g.setLineDash([])}
  for(const f of FX)if(!f.q){const k=f.t/f.l;g.globalAlpha=Math.min(1,k*1.6);
    if(f.R){g.strokeStyle=f.c;g.lineWidth=2+5*k;g.beginPath();g.arc(f.x,f.y,f.R*(1-k)+10,0,7);g.stroke()}
    else{g.fillStyle=f.c;g.beginPath();g.arc(f.x,f.y,f.r*k+1,0,7);g.fill()}}
  g.globalAlpha=1
}
function post(m){ // fog of war: shadow behind walls (visibility polygon) + distance falloff, then floating numbers
  g.fillStyle='rgba(6,8,14,.66)';g.beginPath();g.rect(m.x-1700,m.y-1700,3400,3400);
  for(let i=0;i<=160;i++){const a=i/160*6.2832,dx=Math.cos(a),dy=Math.sin(a),l=rayR(m.x,m.y,dx,dy,V);if(i)g.lineTo(m.x+dx*l,m.y+dy*l);else g.moveTo(m.x+dx*l,m.y+dy*l)}
  g.fill('evenodd');
  const q=g.createRadialGradient(m.x,m.y,V*.6,m.x,m.y,V);q.addColorStop(0,'rgba(6,8,14,0)');q.addColorStop(1,'rgba(6,8,14,.5)');
  g.fillStyle=q;g.fillRect(m.x-1700,m.y-1700,3400,3400);
  g.textAlign='center';g.lineWidth=3;g.strokeStyle='#000';
  for(const f of FX)if(f.q){g.globalAlpha=Math.min(1,f.t/f.l*2);g.font='bold '+f.s+'px sans-serif';g.strokeText(f.q,f.x,f.y);g.fillStyle=f.c;g.fillText(f.q,f.x,f.y)}
  g.globalAlpha=1
}
function ov(m,w,h){ // screen-space overlay: minimap, vignette, bars, kill feed, storm warning
  if(m.cl==null)return;
  const ms=Math.min(150,w*.3),x0=w-ms-10,y0=56,k=ms/2/A,cx=x0+ms/2,cy=y0+ms/2,mp=(x,y)=>[cx+(x-C)*k,cy+(y-C)*k];
  g.save();g.beginPath();g.arc(cx,cy,ms/2,0,7);g.clip();
  g.fillStyle='#10131ccc';g.fillRect(x0,y0,ms,ms);g.fillStyle='#3c5a3c';g.beginPath();g.arc(cx,cy,ms/2-2,0,7);g.fill();
  g.fillStyle='#9c8461';for(const q of Bd){const[a,b]=mp(q.x,q.y);g.fillRect(a,b,q.w*k,q.h*k)}
  g.fillStyle='#2f6fb3';for(const r of R)if(r.w){const[a,b]=mp(r.x,r.y);g.beginPath();g.arc(a,b,r.r*k,0,7);g.fill()}
  if(md==0){g.fillStyle='#ff1e1e66';g.beginPath();g.rect(x0,y0,ms,ms);g.moveTo(cx+zr*k,cy);g.arc(cx,cy,zr*k,0,7);g.fill('evenodd')}
  if(md==2&&hz){const[a,b]=mp(hz.x,hz.y);g.fillStyle='#ffd23f88';g.beginPath();g.arc(a,b,170*k,0,7);g.fill()}
  for(const p of P)if(p.hp>0&&p!==m&&(seen(p,m)||p.fl&16)){const[a,b]=mp(p.x,p.y);g.fillStyle='#ff4d4d';g.beginPath();g.arc(a,b,3.5,0,7);g.fill()}
  const[a,b]=mp(m.x,m.y);g.strokeStyle='#ffffff55';g.lineWidth=1;g.beginPath();g.arc(a,b,V*k,0,7);g.stroke();
  g.translate(a,b);g.rotate(m.a);g.fillStyle='#fff';g.beginPath();g.moveTo(7,0);g.lineTo(-4,4.5);g.lineTo(-4,-4.5);g.fill();
  g.restore();g.strokeStyle='#fffa';g.lineWidth=2;g.beginPath();g.arc(cx,cy,ms/2,0,7);g.stroke();
  const hf=Math.max(0,m.hp)/CL[m.cl].hp;let vv=vg;
  if(m===P[me]&&hf<.3&&m.hp>0)vv=Math.max(vv,.15+.1*Math.sin(performance.now()/180));
  if(vv>0){const q=g.createRadialGradient(w/2,h/2,Math.min(w,h)*.3,w/2,h/2,Math.max(w,h)*.75);q.addColorStop(0,'rgba(255,30,30,0)');q.addColorStop(1,'rgba(255,30,30,'+vv+')');g.fillStyle=q;g.fillRect(0,0,w,h)}
  const bw=Math.min(240,w*.5),bx=(w-bw)/2,by=h-38;
  g.fillStyle='#000a';g.fillRect(bx-2,by-2,bw+4,18);g.fillStyle=hf>.35?'#4cff7a':'#ff4d4d';g.fillRect(bx,by,bw*hf,14);
  g.fillStyle='#fff';g.font='bold 12px sans-serif';g.textAlign='center';g.fillText(Math.ceil(Math.max(0,m.hp)),w/2,by+12);
  g.fillStyle='#000a';g.fillRect(bx-2,by+18,bw+4,10);g.fillStyle=m.ch>=100?'#ff7ac6':'#a64d8a';g.fillRect(bx,by+20,bw*Math.min(1,m.ch/100),6);
  g.textAlign='left';g.font='bold 14px sans-serif';g.lineWidth=3;g.strokeStyle='#000';
  KF.forEach((f,i)=>{g.globalAlpha=Math.min(1,f.t);g.strokeText(f.s,10,84+i*20);g.fillStyle='#fff';g.fillText(f.s,10,84+i*20)});g.globalAlpha=1;
  if(md==0&&m.hp>0&&Math.hypot(m.x-C,m.y-C)>zr){g.textAlign='center';g.font='bold 22px sans-serif';g.fillStyle='#ff6b6b';g.globalAlpha=.6+.4*Math.sin(performance.now()/150);g.fillText('IN THE STORM! Get inside the circle',w/2,h*.2);g.globalAlpha=1}
}
Object.assign(window,{los,nav,fp,seen,drawFx,post,ov,SH:()=>(Math.random()-.5)*shk});

// ---------- patch the game ----------
ai=ptch(ai,[
 ['p.rt-=dt;','p.rt-=dt;p.pr-=dt;'],
 ['vis=q=>q&&q.hp>0&&!(hid(q)&&dist(q)>200);','vis=q=>q&&q.hp>0&&!(hid(q)&&dist(q)>200)&&los(p.x,p.y,q.x,q.y);'],
 ["if(s=='storm'&&p.s!='storm')p.dest={x:C+(Math.random()-.5)*150,y:C+(Math.random()-.5)*150};","if(s=='storm'&&p.s!='storm')p.dest=fp(C,C,90);"],
 ['else{const a=Math.random()*6.28,r=Math.sqrt(Math.random())*zr*.7;p.dest={x:C+Math.cos(a)*r,y:C+Math.sin(a)*r}}','else p.dest=fp(C,C,zr*.7)'],
 ["if(S.m==2&&s=='search')p.dest={x:hz.x+(Math.random()-.5)*220,y:hz.y+(Math.random()-.5)*220};","if(S.m==2&&s=='search')p.dest=fp(hz.x,hz.y,110);"],
 ['p.f=td<rg*.95?1:0}','p.f=td<rg*.95&&los(p.x,p.y,t.x,t.y,1)?1:0}'],
 ['mx=Math.cos(b)*m+Math.cos(b+1.57)*sd;my=Math.sin(b)*m+Math.sin(b+1.57)*sd;aim();','const[nx,ny]=m>0?nav(p,t.x,t.y):[Math.cos(b)*m,Math.sin(b)*m];mx=nx+Math.cos(b+1.57)*sd;my=ny+Math.sin(b+1.57)*sd;aim();'],
 ['mx=-Math.cos(b)+Math.cos(b+1.57)*p.sd*.5;my=-Math.sin(b)+Math.sin(b+1.57)*p.sd*.5;','[mx,my]=nav(p,p.x+(-Math.cos(b)+Math.cos(b+1.57)*p.sd*.5)*260,p.y+(-Math.sin(b)+Math.sin(b+1.57)*p.sd*.5)*260);'],
 ['const d=Math.hypot(p.dest.x-p.x,p.dest.y-p.y);','const dd=p.s==\'chase\'&&p.lk?p.lk:p.dest,d=Math.hypot(dd.x-p.x,dd.y-p.y);'],
 ['if(d>5){mx=(p.dest.x-p.x)/d;my=(p.dest.y-p.y)/d;a=Math.atan2(my,mx)}','if(d>5){[mx,my]=nav(p,dd.x,dd.y);a=Math.atan2(my,mx)}']]);
step=ptch(step,[['p.rv=.8;','p.rv=.8;p.sc=(p.sc|0)+1;'],['p.ch|0,p.pt|0]','p.ch|0,p.pt|0,p.sc|0]']]);
onData=ptch(onData,[['p.pt=a[8]','p.pt=a[8];p.sc=a[9]']]);
draw=ptch(draw,[
 ['g.translate(w/2,h/2);g.scale(s,s);','g.translate(w/2+SH(),h/2+SH());g.scale(s,s);'],
 ['if(i!=me&&(hid(p)&&Math.hypot(p.x-m.x,p.y-m.y)>130||inB(p)&&!inB(m)))return;','if(i!=me&&!seen(p,m))return;'],
 ['person(p,i==me);','person(p,i==me);if(p.hf>0){g.globalAlpha=Math.min(.7,p.hf*6);cir(p.x,p.y,21,\'#fff\');g.globalAlpha=p.fl&2?.4:1}'],
 ["if(!inB(m)){g.fillStyle='#a5483af5'","drawFx();if(!inB(m)){g.fillStyle='#a5483af5'"],
 ['g.arc(C,C,zr,0,7);g.stroke()}','g.arc(C,C,zr,0,7);g.stroke()}post(m);'],
 ["for(const k of['m','a']){const j=tch[k];if(!j)continue;","ov(m,w,h);for(const k of['m','a']){const j=tch[k];if(!j)continue;"]]);
const d0=draw,h0=hud,w0=world,f0=finish;
draw=()=>{const n=performance.now();fx(Math.min(.05,(n-lt)/1000));lt=n;d0()};
hud=()=>{h0();const p=P[me];$('b2').style.outline=p&&p.ch>=100?'4px solid #ff7ac6':''};
world=s=>{w0(s);grid()};
finish=w=>{if(st=='play')sfx(w==me?'win':'lose');f0(w)};

const mb=document.createElement('button');mb.className='s';mb.textContent='\ud83d\udd0a';mb.style.cssText='position:fixed;right:10px;top:10px;padding:8px 12px';
mb.onclick=()=>{mut^=1;mb.textContent=mut?'\ud83d\udd07':'\ud83d\udd0a'};document.body.appendChild(mb);
})();
</script>
